name: CI

# Heimdall `dev` is a frontend demo console on the mock data plane: there is no
# database, migrations or unit-test runner in this branch, so CI checks only what
# exists — secrets, typecheck, lint, production build and Playwright.

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checks:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_HEIMDALL_DATA_PLANE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  e2e:
    name: Playwright (mock data plane)
    runs-on: ubuntu-latest
    needs: [checks]
    env:
      NEXT_PUBLIC_HEIMDALL_DATA_PLANE: mock
      E2E_PORT: "3100"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
